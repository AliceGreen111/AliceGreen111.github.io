    return { puzzle, solution: finalSol[0] || solution };
  }

  // 检查 v 填入 (r,c) 是否与盘面冲突（不含 (r,c) 自身）
  function checkValue(board, r, c, v) {
    const size = board.length;
    const [bh, bw] = boxDims(size);
    for (let i = 0; i < size; i++) {
      if (i !== c && board[r][i] === v) return false;
      if (i !== r && board[i][c] === v) return false;
    }
    const br = Math.floor(r / bh) * bh, bc = Math.floor(c / bw) * bw;
    for (let i = br; i < br + bh; i++)
      for (let j = bc; j < bc + bw; j++)
        if ((i !== r || j !== c) && board[i][j] === v) return false;
    return true;
  }

  function isSolved(board) {
    const size = board.length;
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++) {
        const v = board[r][c];
        if (!v || !checkValue(board, r, c, v)) return false;
      }
    return true;
  }

  const core = {
    DIFFS, DIFF_ORDER,
    boxDims, candidates, randomFill, solveCount, solveList,
    generatePuzzle, checkValue, isSolved
  };

  /* ==================== UI 层 ==================== */
  if (isNode) return core;

  const { Store, Sfx, showModal, registerGame } = window.Mini;

  let state = null;
  let timerId = null;
  let boardEl = null, numpadEl = null;
  let timeEl = null, noteBtnEl = null, diffBtns = [];

  function renderBoard() {
    const size = state.size;
    const [bh, bw] = core.boxDims(size);
    boardEl.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    boardEl.style.maxWidth = size === 9 ? '560px' : (size === 12 ? '580px' : '660px');
    boardEl.dataset.size = size;
    boardEl.innerHTML = '';
    const sel = state.selected;
    const selVal = sel ? state.board[sel[0]][sel[1]] : 0;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const cell = document.createElement('div');
        const cls = ['sd-cell'];
        if (r % bh === 0) cls.push('box-top');
        if (c % bw === 0) cls.push('box-left');
        if (sel && sel[0] === r && sel[1] === c) cls.push('selected');
        // 点击高亮：同行/同列十字线 + 相同数字
        if (sel && (r === sel[0] || c === sel[1])) cls.push('hl-cross');
        if (sel && selVal && state.board[r][c] === selVal) cls.push('hl-same');
        if (state.given[r][c]) cls.push('given');
        else if (state.errors[r][c]) cls.push('err');
        cell.className = cls.join(' ');
        cell.dataset.r = r; cell.dataset.c = c;
        // 内容：数字 / 笔记
        const v = state.board[r][c];
        if (v) {
          cell.textContent = v;
        } else if (state.notes[r][c].length) {
          const nw = Math.ceil(Math.sqrt(size));
          cell.style.display = 'grid';
          cell.style.gridTemplateColumns = 'repeat(' + nw + ', 1fr)';
          const nums = [];
          for (let n = 1; n <= size; n++) nums.push(n);
          nums.forEach(n => {
            const span = document.createElement('span');
            span.className = 'sd-note' + (state.notes[r][c].includes(n) ? ' on' : '');
            span.textContent = n;
            cell.appendChild(span);
          });
        }
        cell.addEventListener('click', () => onCellClick(r, c));
        boardEl.appendChild(cell);
      }
    }
  }

  // 数字 n 是否已全部正确填入（基于答案判定，用于键盘禁用）
  function isNumComplete(n) {
    const size = state.size;
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++)
        if (state.solution[r][c] === n && state.board[r][c] !== n) return false;
    return true;
  }

  function renderNumpad() {
    numpadEl.innerHTML = '';
    numpadEl.style.gridTemplateColumns = 'repeat(' + Math.min(state.size, 9) + ', 1fr)';
    for (let n = 1; n <= state.size; n++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn ghost sd-key';
      btn.textContent = n;
      // 该数字已全部正确填入 → 禁用置灰
      if (isNumComplete(n)) btn.disabled = true;
      btn.addEventListener('click', () => { Sfx.click(); inputNumber(n); });
      numpadEl.appendChild(btn);
    }
  }

  function renderPanel() {
    diffBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.diff === state.diffKey));
    if (timeEl) timeEl.textContent = '⏱ ' + state.time + 's';
  }

  function onCellClick(r, c) {
    if (!state) return;
    state.selected = [r, c];
    renderBoard();
    Sfx.click();
  }

  function inputNumber(n) {
    if (!state || !state.selected) return;
    const [r, c] = state.selected;
    if (state.given[r][c]) return;
    if (state.noteMode) {
      // 笔记切换
      const arr = state.notes[r][c];
      const i = arr.indexOf(n);
      if (i >= 0) arr.splice(i, 1); else arr.push(n);
      state.board[r][c] = 0;
      state.errors[r][c] = false;
      Sfx.click();
    } else {
      const ok = core.checkValue(state.board, r, c, n);
      state.board[r][c] = n;
      state.errors[r][c] = !ok;
      state.notes[r][c] = [];
      if (!state.started) { state.started = true; startTimer(); }
      if (!ok) { Sfx.wrong(); } else { Sfx.pop(); }
      if (core.isSolved(state.board)) { win(); return; }
    }
    renderBoard();
    renderNumpad();   // 刷新键盘禁用状态
  }

  function eraseCell() {
    if (!state || !state.selected) return;
    const [r, c] = state.selected;
    if (state.given[r][c]) return;
    state.board[r][c] = 0;
    state.notes[r][c] = [];
    state.errors[r][c] = false;
    Sfx.click();
    renderBoard();
    renderNumpad();   // 擦除后恢复键盘可用状态
  }

  function onKey(e) {
    if (!state || state.over) return;
    const sel = state.selected;
    if (sel) {
      const r = sel[0], c = sel[1];
      const size = state.size;
      // 方向键移动选中格
      const dirs = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
      const d = dirs[e.key];
      if (d) {
        e.preventDefault();
        const nr = Math.min(size - 1, Math.max(0, r + d[0]));
        const nc = Math.min(size - 1, Math.max(0, c + d[1]));
        state.selected = [nr, nc];
        renderBoard();
        return;
      }
      // 数字键（已填完的数字与按钮一致地忽略）
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= Math.min(size, 9)) {
        e.preventDefault();
        if (!isNumComplete(n)) inputNumber(n);
        return;
      }
    }
    // 笔记模式切换 / 橡皮擦
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); toggleNoteMode(); }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); eraseCell(); }
  }

  function toggleNoteMode() {
    if (!state) return;
    state.noteMode = !state.noteMode;
    const btn = noteBtnEl;
    if (btn) {
      btn.classList.toggle('active', state.noteMode);
      btn.textContent = state.noteMode ? '✏️ 笔记（开）' : '✏️ 笔记（关）';
    }
    Sfx.click();
  }

  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(() => {
      if (!state || state.over) return;
      state.time++;
      if (timeEl) timeEl.textContent = '⏱ ' + state.time + 's';
    }, 1000);
  }

  async function win() {
    if (state.over) return;
    state.over = true;
    clearInterval(timerId);
    Sfx.win();
    const best = Store.get('mini.sudoku.best', {});
    const key = state.diffKey;
    const isRecord = !best[key] || state.time < best[key];
    if (isRecord) {
      best[key] = state.time;
      Store.set('mini.sudoku.best', best);
    }
    const res = await showModal({
      icon: '🏆', title: '解题成功！',
      message: DIFFS[key].label + ' 用时 ' + state.time + ' 秒' + (isRecord ? '\n🎉 新纪录！' : ''),
      buttons: [
        { label: '再来一局', value: 'again', primary: true },
        { label: '返回菜单', value: 'menu' }
      ]
    });
    if (res === 'again') startGame(state.diffKey);
    else window.Mini.showMenu();
  }

  // 生成谜题（16×16 较慢，先显示生成提示再生成）
  function startGame(diffKey) {
    const diff = DIFFS[diffKey];
    clearInterval(timerId);
    state = {
      diffKey, size: diff.size,
      puzzle: null, solution: null, board: null, given: null,
      notes: null, errors: null,
      selected: null, noteMode: false,
      time: 0, started: false, over: false, generating: true
    };
    renderPanel();
    boardEl.innerHTML = '<div class="sd-generating">🕐 正在生成谜题…</div>';
    boardEl.style.gridTemplateColumns = '1fr';
    numpadEl.innerHTML = '';
    setTimeout(() => {
      if (!state || state.diffKey !== diffKey) return;
      const { puzzle, solution } = core.generatePuzzle(diff.size, diff.clues);
      if (!state || state.diffKey !== diffKey) return;
      state.puzzle = puzzle;
      state.solution = solution;
      state.board = puzzle.map(row => row.slice());
      state.given = puzzle.map(row => row.map(v => v !== 0));
      state.notes = puzzle.map(row => row.map(() => []));
      state.errors = puzzle.map(row => row.map(() => false));
      state.generating = false;
      renderNumpad();
      renderBoard();
      renderPanel();
    }, 30);
  }

  function mount(root) {
    root.innerHTML =
      '<div class="panel">' +
        DIFF_ORDER.map(k =>
          '<button class="btn ghost sd-diff-btn" data-diff="' + k + '">' + DIFFS[k].label + '</button>'
        ).join('') +
      '</div>' +
      '<div class="panel">' +
        '<span class="pill good" id="sd-time">⏱ 0s</span>' +
        '<button class="btn ghost" id="sd-note-btn">✏️ 笔记（关）</button>' +
        '<button class="btn ghost" id="sd-erase">🧽 擦除</button>' +
        '<button class="btn ghost" id="sd-restart">🔄 新谜题</button>' +
      '</div>' +
      '<div class="sd-board" id="sd-board"></div>' +
      '<div class="sd-numpad" id="sd-numpad"></div>' +
      '<div class="panel" style="font-size:13px;font-weight:500;color:#8a97a8;">' +
        '点击格子选中，数字键/键盘填入 · N 切换笔记模式 · 填错红字提示 · 方向键移动' +
      '</div>';
    boardEl = root.querySelector('#sd-board');
    numpadEl = root.querySelector('#sd-numpad');
    timeEl = root.querySelector('#sd-time');
    diffBtns = Array.from(root.querySelectorAll('.sd-diff-btn'));
    diffBtns.forEach(btn => btn.addEventListener('click', () => { Sfx.click(); startGame(btn.dataset.diff); }));
    const noteBtn = root.querySelector('#sd-note-btn');
    noteBtnEl = noteBtn;
    if (noteBtn) noteBtn.addEventListener('click', toggleNoteMode);
    const eraseBtn = root.querySelector('#sd-erase');
    if (eraseBtn) eraseBtn.addEventListener('click', eraseCell);
    const restartBtn = root.querySelector('#sd-restart');
    if (restartBtn) restartBtn.addEventListener('click', () => { Sfx.click(); startGame(state ? state.diffKey : 'expert9'); });
    document.addEventListener('keydown', onKey);
    startGame('expert9');
  }

  function unmount() {
    clearInterval(timerId);
    document.removeEventListener('keydown', onKey);
    state = null;
  }

  core.mount = mount;
  core.unmount = unmount;

  registerGame('sudoku', {
    title: '🧩 数独',
    mount: root => mount(root),
    unmount
  });

  return core;
});

</script>
  <script>
/* =========================================================
 * lianliankan.js — 连连看（经典规则 ≤2 拐弯 · 动物 Emoji）
 * 结构：纯逻辑（可 node 测试）+ UI 层（浏览器）
 * ========================================================= */
(function (global, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    global.LianliankanGame = factory();
  }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const isNode = typeof document === 'undefined';

  /* ==================== 配置 ==================== */
  const ROWS = 12, COLS = 10;       // 内部图案区
  const NUM_TYPES = 12;
  const TIME_LIMIT = 180;           // 倒计时（秒）
  const HINT_MAX = 5, SHUFFLE_MAX = 3;
  const ANIMALS = ['🐶','🐱','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸'];

  /* ==================== 纯逻辑 ==================== */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 逻辑网格：(ROWS+2) × (COLS+2)，外圈 -1 表示空路径
  function createBoard(rows, cols, numTypes) {
    const R = rows + 2, C = cols + 2;
    const board = Array.from({ length: R }, () => Array(C).fill(-1));
    const total = rows * cols;
    const tiles = [];
    const pairs = total / 2;
    const perType = Math.floor(pairs / numTypes);
    for (let t = 0; t < numTypes; t++) {
      for (let k = 0; k < perType * 2; k++) tiles.push(t);
    }
    // 若有多余位置，用随机类型补足（保证 tiles 数量 == total）
    while (tiles.length < total) tiles.push(Math.floor(Math.random() * numTypes));
    const shuffled = shuffle(tiles);
    const positions = [];
    for (let r = 1; r <= rows; r++)
      for (let c = 1; c <= cols; c++) positions.push([r, c]);
    shuffle(positions).forEach(([r, c], i) => { board[r][c] = shuffled[i]; });
    return board;
  }

  // 同行/同列两点之间（不含端点）是否全空
  function lineClear(board, r1, c1, r2, c2) {
    if (r1 === r2) {
      const a = Math.min(c1, c2), b = Math.max(c1, c2);
      for (let c = a + 1; c < b; c++) if (board[r1][c] >= 0) return false;
      return true;
    }
    if (c1 === c2) {
      const a = Math.min(r1, r2), b = Math.max(r1, r2);
      for (let r = a + 1; r < b; r++) if (board[r][c1] >= 0) return false;
      return true;
    }
    return false;
  }

  // 求 a→b 的连接路径（≤2 拐弯），返回路径点序列或 null
  function getPath(board, a, b) {
    const r1 = a[0], c1 = a[1], r2 = b[0], c2 = b[1];
    if (r1 === r2 && c1 === c2) return null;
    const t1 = board[r1][c1];
    if (t1 < 0 || t1 !== board[r2][c2]) return null;
    const R = board.length, C = board[0].length;
    // 0 拐
    if (r1 === r2 && lineClear(board, r1, c1, r1, c2)) return [[r1, c1], [r2, c2]];
    if (c1 === c2 && lineClear(board, r1, c1, r2, c1)) return [[r1, c1], [r2, c2]];
    // 1 拐：角 (r1,c2)
    if (board[r1][c2] < 0 && lineClear(board, r1, c1, r1, c2) && lineClear(board, r1, c2, r2, c2))
      return [[r1, c1], [r1, c2], [r2, c2]];
    // 1 拐：角 (r2,c1)
    if (board[r2][c1] < 0 && lineClear(board, r1, c1, r2, c1) && lineClear(board, r2, c1, r2, c2))
      return [[r1, c1], [r2, c1], [r2, c2]];
    // 2 拐：垂直双角 (r1,c) → (r2,c)
    for (let c = 0; c < C; c++) {
      if (board[r1][c] < 0 && board[r2][c] < 0 &&
          lineClear(board, r1, c1, r1, c) && lineClear(board, r1, c, r2, c) && lineClear(board, r2, c, r2, c2))
        return [[r1, c1], [r1, c], [r2, c], [r2, c2]];
    }
    // 2 拐：水平双角 (r,c1) → (r,c2)
    for (let r = 0; r < R; r++) {
      if (board[r][c1] < 0 && board[r][c2] < 0 &&
          lineClear(board, r1, c1, r, c1) && lineClear(board, r, c1, r, c2) && lineClear(board, r, c2, r2, c2))
        return [[r1, c1], [r, c1], [r, c2], [r2, c2]];
    }
    return null;
  }

  function canConnect(board, a, b) {
    return getPath(board, a, b) !== null;
  }

  // 找任意一对可消除的
  function findPair(board) {
    const R = board.length, C = board[0].length;
    const cells = [];
    for (let r = 0; r < R; r++)
      for (let c = 0; c < C; c++)
        if (board[r][c] >= 0) cells.push([r, c]);
    for (let i = 0; i < cells.length; i++) {
      for (let j = i + 1; j < cells.length; j++) {
        const a = cells[i], b = cells[j];
        if (board[a[0]][a[1]] === board[b[0]][b[1]] && getPath(board, a, b)) {
          return [a, b, getPath(board, a, b)];
        }
      }
    }
    return null;
  }

  function remainingCount(board) {
    let n = 0;
    for (const row of board) for (const v of row) if (v >= 0) n++;
    return n;
  }

  // 洗牌：重排剩余图案，尽量保证仍可解
  function shuffleRemaining(board) {
    const tiles = [];
    for (const row of board) for (const v of row) if (v >= 0) tiles.push(v);
    for (let attempt = 0; attempt < 60; attempt++) {
      const s = shuffle(tiles);
      let k = 0;
      for (let r = 0; r < board.length; r++)
        for (let c = 0; c < board[0].length; c++)
          if (board[r][c] >= 0) board[r][c] = s[k++];
      if (findPair(board)) return;
    }
  }

  const core = {
    ROWS, COLS, NUM_TYPES, TIME_LIMIT, HINT_MAX, SHUFFLE_MAX, ANIMALS,
    createBoard, getPath, canConnect, findPair, remainingCount, shuffleRemaining
  };

  /* ==================== UI 层 ==================== */
  if (isNode) return core;

  const { Store, Sfx, showModal, registerGame } = window.Mini;

  let state = null;
  let timerId = null;
  let boardEl = null, wrapEl = null, svgEl = null;

  function getCell(r, c) {
    return boardEl.querySelector('.llk-cell[data-r="' + r + '"][data-c="' + c + '"]');
  }

  // 棋盘格子的尺寸与坐标（与 CSS 的 padding/gap 一致）
  function cellGeom() {
    const rect = boardEl.getBoundingClientRect();
    const C = state.board[0].length, R = state.board.length;
    const pad = 10, gap = 6;
    const cw = (rect.width - pad * 2 - gap * (C - 1)) / C;
    const ch = (rect.height - pad * 2 - gap * (R - 1)) / R;
    return { rect, C, R, pad, gap, cw, ch };
  }

  // 精致连线动画：SVG 折线逐段画出 → 淡出
  function drawPath(path) {
    const { rect, pad, gap, cw, ch } = cellGeom();
    const pts = path.map(([r, c]) =>
      [pad + c * (cw + gap) + cw / 2, pad + r * (ch + gap) + ch / 2]);
    if (!svgEl) return;
    svgEl.setAttribute('width', rect.width);
    svgEl.setAttribute('height', rect.height);
    svgEl.innerHTML = '';
    const NS = 'http://www.w3.org/2000/svg';
    const poly = document.createElementNS(NS, 'polyline');
    poly.setAttribute('points', pts.map(p => p[0] + ',' + p[1]).join(' '));
    poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke', '#5cb8ff');
    poly.setAttribute('stroke-width', '4');
    poly.setAttribute('stroke-linecap', 'round');
    poly.setAttribute('stroke-linejoin', 'round');
    let len = 0;
    for (let i = 1; i < pts.length; i++)
      len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const dur = Math.min(420, 90 + len * 1.3);
    poly.style.strokeDasharray = len;
    poly.style.strokeDashoffset = len;
    poly.style.filter = 'drop-shadow(0 0 4px #5cb8ff)';
    svgEl.appendChild(poly);
    void poly.getBoundingClientRect();   // 强制 reflow 后开始动画
    poly.style.transition = 'stroke-dashoffset ' + dur + 'ms ease-out';
    poly.style.strokeDashoffset = 0;
    setTimeout(() => { poly.style.transition = 'opacity 200ms ease'; poly.style.opacity = 0; }, dur + 30);
    setTimeout(() => { if (svgEl) svgEl.innerHTML = ''; }, dur + 260);
  }

  // 评价文字：路径拐弯数 + 连击结合（连击越高等级越高，上限 LEGENDARY）
  function gradeFor(turns, combo) {
    const NAMES = ['GOOD', 'PERFECT', 'WONDERFUL', 'AMAZING', 'UNBELIEVABLE', 'GODLIKE', 'LEGENDARY'];
    let tier = turns === 0 ? 0 : (turns === 1 ? 1 : 2);
    if (combo >= 16) tier = Math.max(tier, 6);
    else if (combo >= 12) tier = Math.max(tier, 5);
    else if (combo >= 8) tier = Math.max(tier, 4);
    else if (combo >= 5) tier = Math.max(tier, 3);
    else if (combo >= 3) tier = Math.max(tier, 2);
    const cls = ['fx-good', 'fx-perfect', 'fx-wonderful', 'fx-amazing', 'fx-unbelievable', 'fx-godlike', 'fx-legendary'][tier];
    return { text: NAMES[tier] + (combo >= 3 ? ' ×' + combo : ''), cls };
  }

  function showEval(turns, combo, a, b) {
    const { pad, gap, cw, ch } = cellGeom();
    const C = state.board[0].length;
    const r = (a[0] + b[0]) / 2, c = (a[1] + b[1]) / 2;
    const g = gradeFor(turns, combo);
    const el = document.createElement('div');
    el.className = 'fx-text ' + g.cls;
    el.textContent = g.text;
    el.style.left = (pad + c * (cw + gap) + cw / 2) + 'px';
    el.style.top = (pad + r * (ch + gap) + ch / 2) + 'px';
    // 挂到 wrapEl（与棋盘同位置但不会被 renderBoard 清空），保证停留完整播放
    wrapEl.appendChild(el);
    setTimeout(() => el.remove(), 1450);
  }

  // 错误提示：两格抖动 + 红边
  function flashError(a, b) {
    const elA = getCell(a[0], a[1]);
    const elB = getCell(b[0], b[1]);
    if (elA) elA.classList.add('shake');
    if (elB) elB.classList.add('shake');
    Sfx.wrong();
    setTimeout(() => {
      if (elA) elA.classList.remove('shake');
      if (elB) elB.classList.remove('shake');
    }, 420);
  }

  // 粒子碎裂：在格子中心迸发 emoji 与彩色碎片，让消除更醒目
  function burstParticles(r, c, text) {
    const { pad, gap, cw, ch } = cellGeom();
    const cx = pad + c * (cw + gap) + cw / 2;
    const cy = pad + r * (ch + gap) + ch / 2;
    const COLORS = ['#ff9d5c', '#5cb8ff', '#e56aa8', '#ffd23e', '#6bcf7f', '#a85fd6'];
    const n = 8;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('span');
      p.className = 'llk-particle';
      const ang = Math.random() * Math.PI * 2;
      const dist = 22 + Math.random() * 38;
      p.style.setProperty('--tx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(ang) * dist + 'px');
      p.style.setProperty('--rot', (Math.random() * 280 - 140) + 'deg');
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      if (i % 2 === 0) {
        p.textContent = text;
        p.style.fontSize = '14px';
      } else {
        p.style.width = '8px';
        p.style.height = '8px';
        p.style.borderRadius = '50%';
        p.style.background = COLORS[i % COLORS.length];
      }
      boardEl.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
  }

  function renderBoard() {
    const R = state.board.length, C = state.board[0].length;
    boardEl.style.gridTemplateColumns = 'repeat(' + C + ', 1fr)';
    boardEl.innerHTML = '';
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        const cell = document.createElement('div');
        const v = state.board[r][c];
        cell.className = 'llk-cell' + (v < 0 ? ' empty' : '');
        cell.textContent = v >= 0 ? ANIMALS[v] : '';
        cell.dataset.r = r; cell.dataset.c = c;
        if (v >= 0) cell.addEventListener('click', () => onCellClick(r, c));
        boardEl.appendChild(cell);
      }
    }
  }

  function renderPanel() {
    document.getElementById('llk-time').textContent = '⏱ ' + state.timeLeft + 's';
    document.getElementById('llk-time').className = 'pill' + (state.timeLeft <= 30 ? ' warn' : '');
    document.getElementById('llk-left').textContent = '剩余 ' + (remainingCount(state.board) / 2) + ' 对';
    document.getElementById('llk-hint').textContent = '💡 提示 ×' + state.hints;
    document.getElementById('llk-shuffle').textContent = '🔀 洗牌 ×' + state.shuffles;
  }

  function onCellClick(r, c) {
    if (!state || state.busy || state.over) return;
    const sel = state.selected;
    if (!sel) {
      state.selected = [r, c];
      boardEl.querySelectorAll('.llk-cell.selected').forEach(el => el.classList.remove('selected'));
      const el = getCell(r, c);
      if (el) el.classList.add('selected');
      Sfx.click();
      return;
    }
    if (sel[0] === r && sel[1] === c) {
      state.selected = null;
      boardEl.querySelectorAll('.llk-cell.selected').forEach(el => el.classList.remove('selected'));
      return;
    }
    const a = sel, b = [r, c];
    boardEl.querySelectorAll('.llk-cell.selected').forEach(el => el.classList.remove('selected'));
    if (state.board[a[0]][a[1]] !== state.board[r][c]) {
      // 选错：两格图案不同 → 抖动红边，并把第二个格作为新的选中
      flashError(a, b);
      state.selected = null;
      state.selected = [r, c];
      const elB = getCell(r, c);
      if (elB) elB.classList.add('selected');
      return;
    }
    const path = core.getPath(state.board, a, b);
    if (!path) {
      // 图案相同但路径不通 → 抖动红边，保持第一个选中
      flashError(a, b);
      state.selected = a;
      const elA = getCell(a[0], a[1]);
      if (elA) elA.classList.add('selected');
      return;
    }
    state.selected = null;
    state.busy = true;
    removePair(a, b, path).then(() => { if (state) state.busy = false; });
  }

  async function removePair(a, b, path) {
    const elA = getCell(a[0], a[1]), elB = getCell(b[0], b[1]);
    drawPath(path);
    // 连击统计：5 秒无消除则重置
    const now = Date.now();
    if (!state.lastElim || now - state.lastElim > 5000) state.combo = 0;
    state.combo++;
    state.lastElim = now;
    // 评价文字（拐弯数 = 路径段数 - 1）
    showEval(path.length - 2, state.combo, a, b);
    if (elA) elA.classList.add('removing');
    if (elA) burstParticles(a[0], a[1], elA.textContent);
    if (elB) elB.classList.add('removing');
    if (elB) burstParticles(b[0], b[1], elB.textContent);
    Sfx.match();
    await new Promise(res => setTimeout(res, 560));
    if (!state) return;   // 等待动画期间被卸载
    state.board[a[0]][a[1]] = -1;
    state.board[b[0]][b[1]] = -1;
    renderBoard(); renderPanel();
    if (remainingCount(state.board) === 0) { win(); return; }
    // 若无可行对：自动洗牌
    if (!core.findPair(state.board)) {
      state.shuffles = Math.max(0, state.shuffles - 1);
      core.shuffleRemaining(state.board);
      renderBoard(); renderPanel();
      showModal({
        icon: '🔀', title: '自动洗牌',
        message: '当前没有可消除的对，已自动重排图案',
        buttons: [{ label: '继续', value: 'ok', primary: true }],
        cancelable: true
      });
    }
  }

  function doHint() {
    if (!state || state.over || state.hints <= 0) return;
    const pair = core.findPair(state.board);
    if (!pair) return;
    state.hints--;
    renderPanel();
    const [a, b] = pair;
    const elA = boardEl.querySelector('.llk-cell[data-r="' + a[0] + '"][data-c="' + a[1] + '"]');
    const elB = boardEl.querySelector('.llk-cell[data-r="' + b[0] + '"][data-c="' + b[1] + '"]');
    if (elA) elA.classList.add('hint');
    if (elB) elB.classList.add('hint');
    Sfx.task();
    setTimeout(() => {
      if (elA) elA.classList.remove('hint');
      if (elB) elB.classList.remove('hint');
    }, 1600);
  }

  function doShuffle() {
    if (!state || state.over || state.shuffles <= 0) return;
    state.shuffles--;
    core.shuffleRemaining(state.board);
    renderBoard(); renderPanel();
    Sfx.pop();
  }

  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(() => {
      if (!state || state.over) return;
      state.timeLeft--;
      renderPanel();
      if (state.timeLeft <= 0) lose();
    }, 1000);
  }

  async function win() {
    if (state.over) return;
    state.over = true;
    clearInterval(timerId);
    Sfx.win();
    const used = TIME_LIMIT - state.timeLeft;
    const best = Store.get('mini.llk.best', null);
    if (best === null || used < best) Store.set('mini.llk.best', used);
    const isNewBest = best === null || used < best;
    const res = await showModal({
      icon: '🏆', title: '通关成功！',
      message: '用时 ' + used + ' 秒' + (isNewBest ? '\n🎉 新纪录！' : '\n最佳纪录 ' + Math.min(best || used, used) + ' 秒'),
      buttons: [
        { label: '再来一局', value: 'again', primary: true },
        { label: '返回菜单', value: 'menu' }
      ]
    });
    if (res === 'again') startGame();
    else window.Mini.showMenu();
  }

  async function lose() {
    if (state.over) return;
    state.over = true;
    clearInterval(timerId);
    Sfx.lose();
    const res = await showModal({
      icon: '⏰', title: '时间到！',
      message: '还剩 ' + (remainingCount(state.board) / 2) + ' 对未消除',
      buttons: [
        { label: '再来一局', value: 'again', primary: true },
        { label: '返回菜单', value: 'menu' }
      ]
    });
    if (res === 'again') startGame();
    else window.Mini.showMenu();
  }

  function startGame() {
    if (timerId) clearInterval(timerId);
    state = {
      board: null, timeLeft: TIME_LIMIT,
      hints: HINT_MAX, shuffles: SHUFFLE_MAX,
      selected: null, busy: false, over: false,
      combo: 0, lastElim: 0
    };
    // 生成可解棋盘（多次重试）
    for (let i = 0; i < 100; i++) {
      state.board = core.createBoard(ROWS, COLS, NUM_TYPES);
      if (core.findPair(state.board)) break;
    }
    renderBoard(); renderPanel();
    startTimer();
  }

  function mount(root) {
    root.innerHTML =
      '<div class="panel">' +
        '<span class="pill" id="llk-time">⏱ 180s</span>' +
        '<span class="pill good" id="llk-left">剩余 60 对</span>' +
        '<button class="btn ghost" id="llk-hint">💡 提示 ×5</button>' +
        '<button class="btn ghost" id="llk-shuffle">🔀 洗牌 ×3</button>' +
        '<button class="btn ghost" id="llk-restart">🔄 重开</button>' +
      '</div>' +
      '<div class="llk-wrap">' +
        '<div class="llk-board" id="llk-board"></div>' +
        '<svg class="llk-svg" id="llk-svg"></svg>' +
      '</div>' +
      '<div class="panel" style="font-size:13px;font-weight:500;color:#8a97a8;">' +
        '点击两个相同动物，路径不超过 2 个拐弯即可消除 · 连续消除有连击评价' +
      '</div>';
    boardEl = root.querySelector('#llk-board');
    svgEl = root.querySelector('#llk-svg');
    wrapEl = root.querySelector('.llk-wrap');
    svgEl.style.width = '100%';
    svgEl.style.height = '100%';
    root.querySelector('#llk-hint').addEventListener('click', () => { Sfx.click(); doHint(); });
    root.querySelector('#llk-shuffle').addEventListener('click', () => { Sfx.click(); doShuffle(); });
    root.querySelector('#llk-restart').addEventListener('click', () => { Sfx.click(); startGame(); });
    startGame();
  }

  function unmount() {
    if (timerId) clearInterval(timerId);
    state = null;
  }

  core.mount = mount;
  core.unmount = unmount;

  registerGame('lianliankan', {
    title: '🐶 连连看',
    mount: root => mount(root),
    unmount
  });

  return core;
});

</script>
  <script>
/* =========================================================
 * game2048.js — 2048（6×6 · 目标 8192 · 最高分保存）
 * 结构：纯逻辑（可 node 测试）+ UI 层（浏览器）
 * ========================================================= */
(function (global, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    global.Game2048 = factory();
  }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const isNode = typeof document === 'undefined';

  /* ==================== 配置 ==================== */
  const SIZE = 8;
  const GOAL = 8192;

  /* ==================== 纯逻辑 ==================== */
  function createBoard(size) {
    return Array.from({ length: size }, () => Array(size).fill(0));
  }

  // 朝索引 0 方向压缩合并一行
  function slideLine(line) {
    const arr = line.filter(v => v !== 0);
    const out = [];
    let score = 0;
    for (let i = 0; i < arr.length; i++) {
      if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
        out.push(arr[i] * 2);
        score += arr[i] * 2;
        i++;
      } else {
        out.push(arr[i]);
      }
    }
    while (out.length < line.length) out.push(0);
    return { out, score };
  }

  const DIRS = { left: 0, up: 1, right: 2, down: 3 };

  // 移动棋盘；返回 { board, score, moved }
  function move(board, dir) {
    const size = board.length;
    const newBoard = createBoard(size);
    let score = 0, moved = false;
    for (let i = 0; i < size; i++) {
      let line;
      if (dir === DIRS.left) line = board[i].slice();
      else if (dir === DIRS.right) line = board[i].slice().reverse();
      else {
        const col = [];
        for (let r = 0; r < size; r++) col.push(board[r][i]);
        line = dir === DIRS.up ? col : col.reverse();
      }
      const { out, score: s } = slideLine(line);
      score += s;
      const finalLine = (dir === DIRS.right || dir === DIRS.down) ? out.reverse() : out;
      for (let j = 0; j < size; j++) {
        const v = finalLine[j];
        if (dir === DIRS.left || dir === DIRS.right) newBoard[i][j] = v;
        else newBoard[j][i] = v;
        if (v !== board[i][j] && (dir === DIRS.left || dir === DIRS.right)) moved = true;
        if (v !== board[j][i] && (dir === DIRS.up || dir === DIRS.down)) moved = true;
      }
    }
    return { board: newBoard, score, moved };
  }

  // 空位随机生成新数字：2 为主，4/8/16 概率递减（数值越大越难合成）
  // 达成 2048 后进入进阶阶段：2 让出一部分概率给 32/64，难度提升
  function spawnTile(board) {
    const empty = [];
    for (let r = 0; r < board.length; r++)
      for (let c = 0; c < board[0].length; c++)
        if (board[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return null;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const roll = Math.random();
    if (maxTile(board) >= 2048) {
      // 进阶分布：2(60.5%)/4(24%)/8(9.5%)/16(4.15%)/32(1.5%)/64(0.35%)
      board[r][c] = roll < 0.605 ? 2 : roll < 0.845 ? 4 : roll < 0.94 ? 8 : roll < 0.9815 ? 16 : roll < 0.9965 ? 32 : 64;
    } else {
      board[r][c] = roll < 0.65 ? 2 : roll < 0.9 ? 4 : roll < 0.98 ? 8 : 16;
    }
    return [r, c];
  }

  function canMove(board) {
    const size = board.length;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (board[r][c] === 0) return true;
        if (c + 1 < size && board[r][c] === board[r][c + 1]) return true;
        if (r + 1 < size && board[r][c] === board[r + 1][c]) return true;
      }
    }
    return false;
  }

  function maxTile(board) {
    let m = 0;
    for (const row of board) for (const v of row) m = Math.max(m, v);
    return m;
  }

  const core = {
    SIZE, GOAL, DIRS,
    createBoard, slideLine, move, spawnTile, canMove, maxTile
  };

  /* ==================== UI 层 ==================== */
  if (isNode) return core;

  const { Store, Sfx, showModal, registerGame } = window.Mini;

  let state = null;
  let boardEl = null;
  let winShown = false;

  function cellColor(v) {
    if (v === 0) return '#f8f1e5';
    if (v === 2) return '#fdf3e7';
    if (v === 4) return '#fbe3c4';
    if (v === 8) return '#f9c784';
    if (v === 16) return '#f5a65b';
    if (v === 32) return '#f28b4b';
    if (v === 64) return '#ea6f3d';
    if (v === 128) return '#e05633';
    if (v === 256) return '#d9b93f';
    if (v === 512) return '#c9a227';
    if (v === 1024) return '#b8891d';
    if (v === 2048) return '#a8730f';
    if (v === 4096) return '#e56aa8';
    if (v === 8192) return '#a85fd6';
    return '#7c4dd6';
  }

  function cellFont(v) {
    if (v < 100) return '30px';
    if (v < 1000) return '26px';
    if (v < 10000) return '22px';
    return '18px';
  }

  // 计算每个格子相对旧位置的位移（近似配对，spawn 新格除外）
  function computeSlides(oldBoard, newBoard, excludePos) {
    const size = oldBoard.length;
    const used = Array.from({ length: size }, () => Array(size).fill(false));
    const slides = new Map();
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (excludePos && excludePos[0] === r && excludePos[1] === c) continue;
        const v = newBoard[r][c];
        if (v === 0) continue;
        let found = null;
        outer:
        for (let or2 = 0; or2 < size; or2++) {
          for (let oc2 = 0; oc2 < size; oc2++) {
            if (!used[or2][oc2] && oldBoard[or2][oc2] === v) { found = [or2, oc2]; break outer; }
          }
        }
        if (found) {
          used[found[0]][found[1]] = true;
          slides.set(r + ',' + c, { dr: found[0] - r, dc: found[1] - c });
        }
      }
    }
    return slides;
  }

  function renderBoard(newPos, mergedCells, slides) {
    const size = SIZE;
    boardEl.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    boardEl.innerHTML = '';
    // 与 CSS 一致：padding 10、gap 6，格子正方形
    const pad = 10, gap = 6;
    const cw = Math.max(1, (boardEl.clientWidth - pad * 2 - gap * (size - 1)) / size);
    const ch = cw;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const cell = document.createElement('div');
        const v = state.board[r][c];
        cell.className = 'g2048-cell';
        cell.textContent = v || '';
        cell.style.background = cellColor(v);
        cell.style.color = v >= 128 ? '#fff' : '#6b5b45';
        cell.style.fontSize = v ? cellFont(v) : '30px';
        const key = r + ',' + c;
        if (slides && slides.has(key) && !(newPos && newPos[0] === r && newPos[1] === c)) {
          const s = slides.get(key);
          cell.style.transform = 'translate(' + (s.dc * cw) + 'px,' + (s.dr * ch) + 'px)';
          cell.dataset.slide = '1';
        }
        if (newPos && newPos[0] === r && newPos[1] === c) cell.classList.add('new');
        if (mergedCells && mergedCells.has(key)) cell.classList.add('merged');
        boardEl.appendChild(cell);
      }
    }
    // 滑动动画：reflow 后带摩擦缓动曲线归位
    if (slides && slides.size) {
      void boardEl.offsetWidth;
      boardEl.querySelectorAll('.g2048-cell[data-slide]').forEach(el => {
        el.style.transition = 'transform 0.18s cubic-bezier(.22,.85,.35,1)';
        el.style.transform = '';
      });
    }
  }

  function renderPanel() {
    document.getElementById('g2048-score').textContent = '分数 ' + state.score;
    document.getElementById('g2048-best').textContent = '最高 ' + state.best;
    // 目标标题 + 进度条 + 当前最大数字
    const max = core.maxTile(state.board);
    const fill = document.getElementById('g2048-goal-fill');
    const maxEl = document.getElementById('g2048-max');
    if (fill) fill.style.width = Math.min(100, max / GOAL * 100) + '%';
    if (maxEl) maxEl.textContent = '当前最大 ' + max + ' / ' + GOAL;
  }

  function onMove(dir) {
    if (!state || state.over) return;
    const oldBoard = state.board.map(row => row.slice());
    const res = core.move(state.board, dir);
    if (!res.moved) return;
    // 标记真正的合并格（值翻倍），而非仅“移动”的格子
    const merged = new Set();
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (oldBoard[r][c] > 0 && res.board[r][c] === oldBoard[r][c] * 2)
          merged.add(r + ',' + c);
    state.board = res.board;
    state.score += res.score;
    const newPos = core.spawnTile(state.board);
    if (state.score > state.best) {
      state.best = state.score;
      Store.set('mini.2048.best', state.best);
    }
    const slides = computeSlides(oldBoard, state.board, newPos);
    // 合并格不做位移动画（原地弹跳即可），避免 transform 与缩放动画冲突
    merged.forEach(k => slides.delete(k));
    renderBoard(newPos, merged, slides);
    renderPanel();
    Sfx.merge();
    const max = core.maxTile(state.board);
    if (!winShown && max >= GOAL) {
      winShown = true;
      win();
    } else if (!core.canMove(state.board)) {
      state.over = true;
      lose();
    }
  }

  async function win() {
    state.over = true; // 弹窗期间锁定操作
    Sfx.win();
    const res = await showModal({
      icon: '🎉', title: '达成 ' + GOAL + '！',
      message: '太厉害了！分数 ' + state.score,
      buttons: [
        { label: '继续挑战', value: 'continue', primary: true },
        { label: '重新开始', value: 'restart' },
        { label: '返回菜单', value: 'menu' }
      ]
    });
    if (res === 'restart') startGame();
    else if (res === 'continue') state.over = false;
    else if (res === 'menu') window.Mini.showMenu();
    else state.over = false; // 防御：异常关闭时解锁，避免锁死
  }

  async function lose() {
    Sfx.lose();
    const res = await showModal({
      icon: '💀', title: '游戏结束',
      message: '无法继续移动了\n最终分数 ' + state.score,
      buttons: [
        { label: '重新开始', value: 'restart', primary: true },
        { label: '返回菜单', value: 'menu' }
      ]
    });
    if (res === 'restart') startGame();
    else window.Mini.showMenu();
  }

  function onKey(e) {
    const map = {
      ArrowLeft: 'left', ArrowUp: 'up', ArrowRight: 'right', ArrowDown: 'down',
      a: 'left', w: 'up', d: 'right', s: 'down',
      A: 'left', W: 'up', D: 'right', S: 'down'
    };
    const dir = map[e.key];
    if (dir) {
      e.preventDefault();
      onMove(core.DIRS[dir]);
    }
  }

  function startGame() {
    state = {
      board: core.createBoard(SIZE),
      score: 0,
      best: Store.get('mini.2048.best', 0),
      over: false
    };
    winShown = false;
    core.spawnTile(state.board);
    core.spawnTile(state.board);
    renderBoard(); renderPanel();
  }

  function mount(root) {
    root.innerHTML =
      '<div class="panel">' +
        '<span class="pill good" id="g2048-score">分数 0</span>' +
        '<span class="pill" id="g2048-best">最高 0</span>' +
        '<button class="btn ghost" id="g2048-restart">🔄 重开</button>' +
      '</div>' +
      '<div class="g2048-goal">' +
        '<div class="goal-title">🎯 目标 ' + GOAL + '</div>' +
        '<div class="goal-bar"><div class="goal-fill" id="g2048-goal-fill"></div></div>' +
        '<div class="goal-max" id="g2048-max">当前最大 0 / ' + GOAL + '</div>' +
      '</div>' +
      '<div class="g2048-board" id="g2048-board"></div>' +
      '<div class="panel" style="font-size:13px;font-weight:500;color:#8a97a8;">' +
        '方向键 / WASD / 手机滑动，相同数字合并，达到 ' + GOAL + ' 即可获胜' +
      '</div>';
    boardEl = document.getElementById('g2048-board');
    // 手机触摸滑动
    let touchStart = null;
    boardEl.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    boardEl.addEventListener('touchend', (e) => {
      if (!touchStart || !e.changedTouches.length) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
      touchStart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      const dir = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? 'right' : 'left')
        : (dy > 0 ? 'down' : 'up');
      onMove(core.DIRS[dir]);
    }, { passive: true });
    document.getElementById('g2048-restart').addEventListener('click', () => { Sfx.click(); startGame(); });
    document.addEventListener('keydown', onKey);
    startGame();
  }

  function unmount() {
    document.removeEventListener('keydown', onKey);
    state = null;
  }

  core.mount = mount;
  core.unmount = unmount;

  registerGame('game2048', {
    title: '🔢 2048',
    mount: root => mount(root),
    unmount
  });

  return core;
});

</script>
  <script>
/* =========================================================
 * minesweeper.js — 扫雷（三档难度 · 完整操作 · 计时纪录）
 * 结构：纯逻辑（可 node 测试）+ UI 层（浏览器）
 * ========================================================= */
(function (global, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    global.MinesweeperGame = factory();
  }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const isNode = typeof document === 'undefined';

  /* ==================== 配置 ==================== */
  const DIFFS = {
    easy:   { label: '初级', rows: 9,  cols: 9,  mines: 10 },
    medium: { label: '中级', rows: 16, cols: 16, mines: 40 },
    hard:   { label: '高级', rows: 16, cols: 30, mines: 99 }
  };
  const FLAG = 1, QUESTION = 2;

  /* ==================== 纯逻辑 ==================== */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function neighbors(rows, cols, r, c) {
    const list = [];
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) list.push([rr, cc]);
      }
    return list;
  }

  // 生成雷盘；safe 位置及其周围 8 格不布雷（首次点击保护）
  function createBoard(rows, cols, mines, safeR, safeC) {
    const board = Array.from({ length: rows }, () => Array(cols).fill(0));
    const forbidden = new Set();
    if (safeR >= 0 && safeC >= 0) {
      forbidden.add(safeR + ',' + safeC);
      neighbors(rows, cols, safeR, safeC).forEach(([r, c]) => forbidden.add(r + ',' + c));
    }
    const candidates = [];
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (!forbidden.has(r + ',' + c)) candidates.push([r, c]);
    const chosen = shuffle(candidates).slice(0, mines);
    chosen.forEach(([r, c]) => { board[r][c] = -1; });
    // 计算数字
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (board[r][c] !== -1)
          board[r][c] = neighbors(rows, cols, r, c).filter(([rr, cc]) => board[rr][cc] === -1).length;
    return board;
  }

  function countMines(board) {
    let n = 0;
    for (const row of board) for (const v of row) if (v === -1) n++;
    return n;
  }

  // 揭开一格（含 0 格 BFS 展开）；返回 { exploded, cells }
  function revealCell(board, revealed, flagged, r, c) {
    if (revealed[r][c] || flagged[r][c] === FLAG) return { exploded: false, cells: [] };
    const rows = board.length, cols = board[0].length;
    const cells = [];
    const stack = [[r, c]];
    let exploded = false;
    while (stack.length) {
      const [rr, cc] = stack.pop();
      if (revealed[rr][cc] || flagged[rr][cc] === FLAG) continue;
      revealed[rr][cc] = true;
      cells.push([rr, cc]);
      if (board[rr][cc] === -1) { exploded = true; continue; }
      if (board[rr][cc] === 0) {
        neighbors(rows, cols, rr, cc).forEach(([nr, nc]) => {
          if (!revealed[nr][nc] && flagged[nr][nc] !== FLAG) stack.push([nr, nc]);
        });
      }
    }
    return { exploded, cells };
  }

  function flagCountAround(flagged, r, c) {
    return neighbors(flagged.length, flagged[0].length, r, c)
      .filter(([rr, cc]) => flagged[rr][cc] === FLAG).length;
  }

  // 双击数字格：周围旗数 == 数字时翻开其余格子
  function chord(board, revealed, flagged, r, c) {
    const n = board[r][c];
    if (n <= 0 || !revealed[r][c]) return { exploded: false, cells: [] };
    if (flagCountAround(flagged, r, c) !== n) return { exploded: false, cells: [] };
    const cells = [];
    let exploded = false;
    neighbors(board.length, board[0].length, r, c).forEach(([rr, cc]) => {
      if (revealed[rr][cc] || flagged[rr][cc] === FLAG) return;
      const res = revealCell(board, revealed, flagged, rr, cc);
      res.cells.forEach(p => cells.push(p));
      if (res.exploded) exploded = true;
    });
    return { exploded, cells };
  }

  // 是否胜利：所有非雷格均已揭开
  function isWon(board, revealed) {
    const rows = board.length, cols = board[0].length;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (board[r][c] !== -1 && !revealed[r][c]) return false;
    return true;
  }

  const core = {
    DIFFS, FLAG, QUESTION,
    createBoard, countMines, revealCell, flagCountAround, chord, isWon, neighbors
  };

  /* ==================== UI 层 ==================== */
  if (isNode) return core;

  const { Store, Sfx, showModal, registerGame } = window.Mini;

  let state = null;
  let timerId = null;
  let boardEl = null, minesEl = null, timeEl = null, diffBtns = [], modeBtnEl = null;

  function cellClass(r, c) {
    const rev = state.revealed[r][c];
    if (rev) {
      if (state.board[r][c] === -1) return 'ms-cell revealed mine';
      return 'ms-cell revealed';
    }
    return 'ms-cell';
  }

  function cellContent(r, c) {
    const rev = state.revealed[r][c];
    if (!rev) {
      if (state.flagged[r][c] === FLAG) return '🚩';
      if (state.flagged[r][c] === QUESTION) return '❓';
      return '';
    }
    const v = state.board[r][c];
    if (v === -1) return '💣';
    if (v === 0) return '';
    return '<span class="ms-num-' + v + '">' + v + '</span>';
  }

  function renderBoard() {
    const rows = state.rows, cols = state.cols;
    boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    boardEl.innerHTML = '';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = cellClass(r, c);
        cell.innerHTML = cellContent(r, c);
        cell.dataset.r = r; cell.dataset.c = c;
        cell.addEventListener('click', () => onLeft(r, c, false));
        cell.addEventListener('dblclick', () => onLeft(r, c, true));
        cell.addEventListener('contextmenu', (e) => { e.preventDefault(); onRight(r, c); });
        boardEl.appendChild(cell);
      }
    }
    if (minesEl) minesEl.textContent = '💣 ' + (state.mines - state.flagsUsed);
    if (timeEl) timeEl.textContent = '⏱ ' + state.time + 's';
  }

  function onRight(r, c) {
    if (!state || state.over) return;
    if (state.revealed[r][c]) return;
    state.flagged[r][c] = (state.flagged[r][c] + 1) % 3;
    state.flagsUsed = 0;
    for (let i = 0; i < state.rows; i++)
      for (let j = 0; j < state.cols; j++)
        if (state.flagged[i][j] === FLAG) state.flagsUsed++;
    Sfx.flag();
    renderBoard();
  }

  function onLeft(r, c, isDbl) {
    if (!state || state.over) return;
    // 手机标旗模式：左键也走标记逻辑（电脑右键仍可用）
    if (state.flagMode) { onRight(r, c); return; }
    if (state.revealed[r][c]) {
      // 已揭开数字格：单击或双击都尝试 chord（经典行为）
      const res = core.chord(state.board, state.revealed, state.flagged, r, c);
      if (res.cells.length) Sfx.reveal();
      if (res.exploded) { endGame(false); return; }
      if (isWonNow()) { endGame(true); return; }
      renderBoard();
      return;
    }
    if (state.flagged[r][c] === FLAG) return;
    // 首击保护：第一次揭开前才布雷
    if (!state.started) {
      state.board = core.createBoard(state.rows, state.cols, state.mines, r, c);
      state.started = true;
      startTimer();
    }
    const res = core.revealCell(state.board, state.revealed, state.flagged, r, c);
    if (res.cells.length) Sfx.reveal();
    if (res.exploded) { endGame(false); return; }
    if (isWonNow()) { endGame(true); return; }
    renderBoard();
  }

  function isWonNow() {
    return core.isWon(state.board, state.revealed);
  }

  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(() => {
      if (!state || state.over) return;
      state.time++;
      if (timeEl) timeEl.textContent = '⏱ ' + state.time + 's';
    }, 1000);
  }

  function revealAllMines() {
    for (let r = 0; r < state.rows; r++)
      for (let c = 0; c < state.cols; c++)
        if (state.board[r][c] === -1 && !state.revealed[r][c])
          state.revealed[r][c] = true;
  }

  async function endGame(won) {
    if (state.over) return;
    state.over = true;
    clearInterval(timerId);
    if (!won) {
      revealAllMines();
      renderBoard();
      Sfx.boom();
      const res = await showModal({
        icon: '💥', title: '踩到雷了！',
        message: '用时 ' + state.time + ' 秒',
        buttons: [
          { label: '再来一局', value: 'again', primary: true },
          { label: '返回菜单', value: 'menu' }
        ]
      });
      if (res === 'again') startGame(state.diffKey);
      else window.Mini.showMenu();
      return;
    }
    Sfx.win();
    // 纪录保存（记录是否破纪录，避免存后误报）
    const best = Store.get('mini.ms.best', {});
    const key = state.diffKey;
    const prevBest = best[key];
    const isRecord = !prevBest || state.time < prevBest;
    if (isRecord) {
      best[key] = state.time;
      Store.set('mini.ms.best', best);
    }
    const res = await showModal({
      icon: '🏆', title: '扫雷成功！',
      message: DIFFS[key].label + ' 用时 ' + state.time + ' 秒' + (isRecord ? '\n🎉 新纪录！' : ''),
      buttons: [
        { label: '再来一局', value: 'again', primary: true },
        { label: '返回菜单', value: 'menu' }
      ]
    });
    if (res === 'again') startGame(state.diffKey);
    else window.Mini.showMenu();
  }

  function startGame(diffKey) {
    const diff = DIFFS[diffKey];
    clearInterval(timerId);
    state = {
      diffKey, rows: diff.rows, cols: diff.cols, mines: diff.mines,
      board: core.createBoard(diff.rows, diff.cols, diff.mines, -1, -1),
      revealed: Array.from({ length: diff.rows }, () => Array(diff.cols).fill(false)),
      flagged: Array.from({ length: diff.rows }, () => Array(diff.cols).fill(0)),
      flagsUsed: 0, time: 0, started: false, over: false,
      flagMode: false
    };
    // 高亮当前难度按钮
    diffBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.diff === diffKey);
    });
    if (modeBtnEl) modeBtnEl.textContent = state.flagMode ? '🚩 模式：标旗' : '⚒ 模式：揭开';
    renderBoard();
  }

  function toggleMode() {
    if (!state) return;
    state.flagMode = !state.flagMode;
    if (modeBtnEl) modeBtnEl.textContent = state.flagMode ? '🚩 模式：标旗' : '⚒ 模式：揭开';
    Sfx.click();
  }

  function mount(root) {
    root.innerHTML =
      '<div class="panel">' +
        Object.keys(DIFFS).map(k =>
          '<button class="btn ghost ms-diff-btn" data-diff="' + k + '">' + DIFFS[k].label + '</button>'
        ).join('') +
        '<span class="pill" id="ms-mines">💣 10</span>' +
        '<span class="pill" id="ms-time">⏱ 0s</span>' +
        '<button class="btn ghost" id="ms-mode">⚒ 模式：揭开</button>' +
        '<button class="btn ghost" id="ms-restart">🔄 重开</button>' +
      '</div>' +
      '<div class="ms-board" id="ms-board"></div>' +
      '<div class="panel" style="font-size:13px;font-weight:500;color:#8a97a8;">' +
        '左键揭开 · 右键/模式按钮标旗 · 点击已翻开数字可快速翻开周围' +
      '</div>';
    // 一律在容器内查询，避免全局 id 冲突导致找不到元素
    boardEl = root.querySelector('#ms-board');
    minesEl = root.querySelector('#ms-mines');
    timeEl = root.querySelector('#ms-time');
    modeBtnEl = root.querySelector('#ms-mode');
    diffBtns = Array.from(root.querySelectorAll('.ms-diff-btn'));
    if (modeBtnEl) modeBtnEl.addEventListener('click', toggleMode);
    const restartBtn = root.querySelector('#ms-restart');
    if (restartBtn) restartBtn.addEventListener('click', () => { Sfx.click(); startGame(state ? state.diffKey : 'easy'); });
    diffBtns.forEach(btn => {
      btn.addEventListener('click', () => { Sfx.click(); startGame(btn.dataset.diff); });
    });
    startGame('easy');
  }

  function unmount() {
    clearInterval(timerId);
    state = null;
  }

  core.mount = mount;
  core.unmount = unmount;

  registerGame('minesweeper', {
    title: '💣 扫雷',
    mount: root => mount(root),
    unmount
  });

  return core;
});

</script>
