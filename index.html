<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>小游戏合集</title>
  <style>
/* ===== 清新卡通风 全局样式 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-from: #e8f5ff;
  --bg-to: #fff7e8;
  --card-bg: #ffffff;
  --text-main: #3d4a5c;
  --text-soft: #8a97a8;
  --accent: #ff9d5c;
  --accent2: #5cb8ff;
  --shadow: 0 6px 20px rgba(90, 120, 160, 0.18);
  --radius: 18px;
}

html, body {
  height: 100%;
  font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  color: var(--text-main);
  background: linear-gradient(160deg, var(--bg-from), var(--bg-to));
  background-attachment: fixed;
}

body { overflow-x: hidden; }

.view {
  min-height: 100vh;
  padding: 24px 16px 40px;
}

/* ===== 开始菜单 ===== */
.view-menu {
  display: flex;
  align-items: center;
  justify-content: center;
}

.menu-wrap {
  max-width: 860px;
  width: 100%;
  text-align: center;
}

.menu-title {
  font-size: 52px;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(120deg, #ff9d5c, #ff6f91, #5cb8ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 30px rgba(255, 157, 92, 0.15);
  margin-bottom: 8px;
}

.menu-subtitle {
  color: var(--text-soft);
  font-size: 16px;
  margin-bottom: 36px;
}

.menu-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 20px;
}

.game-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 28px 16px 22px;
  background: var(--card-bg);
  border: none;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  font-family: inherit;
  color: var(--text-main);
}

.game-card:hover {
  transform: translateY(-6px) scale(1.03);
  box-shadow: 0 12px 28px rgba(90, 120, 160, 0.28);
}

.game-card:active { transform: translateY(-2px) scale(0.99); }

.card-icon { font-size: 52px; line-height: 1; }
.card-name { font-size: 22px; font-weight: 700; }
.card-desc { font-size: 13px; color: var(--text-soft); }

.menu-stats {
  margin-top: 28px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px 22px;
  font-size: 13px;
  color: var(--text-soft);
}

.menu-stats span {
  background: rgba(255, 255, 255, 0.6);
  padding: 5px 14px;
  border-radius: 999px;
}

/* ===== 游戏视图 ===== */
.view-game { padding-top: 16px; }

.game-header {
  max-width: 1000px;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.btn-back {
  background: rgba(255, 255, 255, 0.85);
  border: none;
  border-radius: 999px;
  padding: 8px 18px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(90, 120, 160, 0.15);
  transition: transform 0.12s ease, background 0.12s ease;
  font-family: inherit;
}

.btn-back:hover { background: #ffffff; transform: translateY(-2px); }

.game-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 1px;
}

.header-spacer { width: 92px; }

.game-root {
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* 游戏通用面板（状态条） */
.panel {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px 18px;
  background: rgba(255, 255, 255, 0.85);
  border-radius: var(--radius);
  padding: 10px 20px;
  box-shadow: 0 3px 12px rgba(90, 120, 160, 0.12);
  font-size: 15px;
  font-weight: 600;
}

.panel .pill {
  background: #f0f6ff;
  border-radius: 999px;
  padding: 4px 14px;
  white-space: nowrap;
}

.panel .pill.warn { background: #ffe9e0; color: #e0603a; }
.panel .pill.good { background: #e6f7ec; color: #2fa15e; }

.btn {
  background: linear-gradient(120deg, var(--accent2), var(--accent));
  border: none;
  border-radius: 999px;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  padding: 8px 20px;
  cursor: pointer;
  transition: transform 0.12s ease, filter 0.12s ease;
  font-family: inherit;
}

.btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
.btn:active { transform: translateY(0); }
.btn:disabled { filter: grayscale(0.6) brightness(0.9); cursor: not-allowed; transform: none; }

.btn.ghost {
  background: #eef3f9;
  color: var(--text-main);
}

/* ===== 弹窗 ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(50, 65, 85, 0.45);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-box {
  background: #ffffff;
  border-radius: 22px;
  padding: 30px 36px;
  max-width: 420px;
  width: calc(100% - 40px);
  text-align: center;
  box-shadow: 0 18px 50px rgba(40, 60, 90, 0.35);
  animation: popIn 0.25s ease;
}

@keyframes popIn {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal-icon { font-size: 52px; margin-bottom: 8px; }
.modal-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.modal-message { color: var(--text-soft); font-size: 15px; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }
.modal-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ===== 数独 ===== */
.sd-board {
  display: grid;
  gap: 0;
  background: #ffffff;
  border: 3px solid #3d4a5c;
  border-radius: 10px;
  box-shadow: var(--shadow);
  user-select: none;
  max-width: 560px;
}

/* 字号按尺寸档位（小屏由媒体查询覆盖） */
.sd-board[data-size="9"] .sd-cell { font-size: 24px; }
.sd-board[data-size="12"] .sd-cell { font-size: 16px; }
.sd-board[data-size="16"] .sd-cell { font-size: 12px; }

.sd-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 600;
  color: var(--text-main);
  border: 1px solid #d8e0ea;
  cursor: pointer;
  aspect-ratio: 1 / 1;   /* 固定正方形（去掉 min-height，避免小屏时高>宽） */
  transition: background 0.1s;
}

.sd-cell.box-top { border-top: 2px solid #3d4a5c; }
.sd-cell.box-left { border-left: 2px solid #3d4a5c; }
.sd-cell.given { font-weight: 800; color: #1f2d3d; }

/* 点击高亮：十字线 + 相同数字 */
.sd-cell.hl-cross { background: #eef4fb; }
.sd-cell.hl-same { background: #d6e8fb; }
.sd-cell.hl-cross.hl-same { background: #cfe3f8; }

/* 高优先级：错误/选中置于 hl 之后，不被高亮覆盖 */
.sd-cell.err { color: #e04f3a; background: #ffe9e9; font-weight: 800; }
.sd-cell.selected { background: #fff0d9; box-shadow: inset 0 0 0 2px #ff9d5c; }
.sd-cell:hover { background: #f2f8ff; }

.sd-note {
  font-size: 11px;   /* 笔记加大，易看清 */
  color: #c8d4e0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sd-note.on { color: #5b7a9a; font-weight: 700; }

.sd-numpad {
  display: grid;
  gap: 6px;
  max-width: 560px;
}

.sd-key { padding: 8px 4px; font-size: 15px; }
.sd-key:disabled {
  background: #e9eef4;
  color: #b3bfcc;
  filter: none;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.sd-generating {
  padding: 40px;
  font-size: 16px;
  color: var(--text-soft);
}

/* ===== 消消乐 ===== */
.game-root[data-game="match3"] .panel { max-width: 640px; }

.task-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 640px;
}

.task-item {
  background: #fff;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(90, 120, 160, 0.12);
  border: 2px solid transparent;
  transition: border-color 0.2s, background 0.2s;
}

.task-item.done {
  border-color: #4cc97e;
  background: #eefaf2;
  color: #2fa15e;
  text-decoration: line-through;
  opacity: 0.75;
}

.match3-board {
  display: grid;
  position: relative;   /* 评价文字定位基准 */
  background: rgba(255, 255, 255, 0.9);
  border-radius: 14px;
  padding: 8px;
  box-shadow: var(--shadow);
  user-select: none;
}

.m3-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.12s;
  animation: m3Pop 0.18s ease;
}

.m3-cell:hover { background: #f2f8ff; }
.m3-cell.selected {
  background: #fff0d9;
  transform: scale(1.12);
  box-shadow: 0 0 0 2px #ff9d5c;
  z-index: 2;
}

.m3-cell.swap-anim { transition: transform 0.16s ease; }
.m3-cell.dropping { transition: transform 0.22s ease-in; }

/* 交换位移动画 */
.m3-cell.swap-anim {
  transition: transform 0.16s ease;
  z-index: 3;
}

/* 下落滑入动画 */
.m3-cell.drop-in { animation: m3DropIn 0.3s ease; }

@keyframes m3DropIn {
  from { transform: translateY(-38px); opacity: 0.2; }
  to { transform: translateY(0); opacity: 1; }
}

/* 错误提示：抖动 + 红边 */
.m3-cell.shake {
  animation: m3Shake 0.32s ease;
  background: #ffe3e3;
  box-shadow: inset 0 0 0 2px #ff6b6b;
}

@keyframes m3Shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* 消除评价文字 */
.fx-text {
  position: absolute;
  transform: translate(-50%, -50%);
  font-weight: 900;
  font-size: 30px;
  letter-spacing: 1px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 10;
  animation: fxPop 1.25s ease forwards;
  /* 白色描边 + 阴影，颜色更显眼 */
  -webkit-text-stroke: 2.5px #ffffff;
  paint-order: stroke fill;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 0 14px rgba(255, 255, 255, 0.7);
}

.fx-good { color: #3aa0ff; }
.fx-perfect { color: #ff8c2e; }
.fx-wonderful { color: #e14f9e; font-size: 40px; }
.fx-amazing { color: #8f4fd6; font-size: 40px; }
.fx-unbelievable { color: #ff3d71; font-size: 44px; }
.fx-godlike { color: #ffb400; font-size: 46px; }
.fx-legendary { color: #ff7a00; font-size: 50px; }

/* 1.25s：弹入 → 停留 → 平滑淡出 + 上浮 */
@keyframes fxPop {
  0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
  12% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  20% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  72% { transform: translate(-50%, -50%) scale(1) translateY(0); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1.25) translateY(-28px); opacity: 0; }
}

@keyframes m3Pop {
  from { transform: scale(0.5); opacity: 0.3; }
  to { transform: scale(1); opacity: 1; }
}

.m3-cell.clearing {
  animation: m3Clear 0.28s ease forwards;
}

@keyframes m3Clear {
  0% { transform: scale(1); opacity: 1; }
  40% { transform: scale(1.25); }
  100% { transform: scale(0); opacity: 0; }
}

/* ===== 连连看 ===== */
.game-root[data-game="lianliankan"] .panel { max-width: 720px; }

.llk-wrap { position: relative; }

.llk-board {
  display: grid;
  position: relative;       /* 粒子/选中高亮的定位基准 */
  gap: 6px;                 /* 格子间距 */
  background: #e8f0f8;      /* 浅色底衬托格子 */
  border-radius: 14px;
  padding: 10px;
  box-shadow: var(--shadow);
  user-select: none;
}

.llk-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  aspect-ratio: 1 / 1;   /* 固定正方形：消除后空行也不会塌陷 */
  background: linear-gradient(150deg, #ffffff 60%, #e8f0f8);  /* 体积感高光 */
  border: 2px solid #d3dfeb;
  border-radius: 9px;
  box-shadow: 0 3px 0 #b9c8d8, inset 0 1px 1px rgba(255, 255, 255, 0.95);  /* 底部投影凸起 */
  cursor: pointer;
  transition: background 0.12s, transform 0.12s, border-color 0.12s, box-shadow 0.12s;
}

/* 已消除的空格：保留固定格子位置与可见边界（不再透明连片） */
.llk-cell.empty {
  cursor: default;
  background: rgba(255, 255, 255, 0.5);
  border-color: #e2eaf3;
  box-shadow: none;
  font-size: 0;
}
.llk-cell:hover:not(.empty) {
  background: linear-gradient(150deg, #f7fbff, #e8f4ff);
  border-color: #9ccdf5;
  box-shadow: 0 4px 0 #a9c4dc;
  transform: translateY(-1px);
}

.llk-cell.selected {
  background: linear-gradient(150deg, #fff6e4, #ffe9c4);
  border-color: #ff9d5c;
  transform: scale(1.12) translateY(-2px);
  box-shadow: 0 5px 0 #d88a4f;
  z-index: 2;
}

/* 错误提示：抖动 + 红边 */
.llk-cell.shake {
  animation: llkShake 0.4s ease;
  border-color: #ff6b6b;
  background: #ffe9e9;
  box-shadow: 0 3px 0 #d88a8a, inset 0 0 0 2px #ff8a8a;
}

@keyframes llkShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

.llk-cell.removing {
  animation: llkRemove 0.5s ease forwards;
  z-index: 3;
}

@keyframes llkRemove {
  0% { transform: scale(1); filter: brightness(1); }
  35% { transform: scale(1.4); filter: brightness(1.7); }
  100% { transform: scale(0); filter: brightness(2.2); opacity: 0; }
}

/* 粒子碎裂碎片 */
.llk-particle {
  position: absolute;
  pointer-events: none;
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  line-height: 1;
  animation: llkBurst 0.55s cubic-bezier(.2, .7, .4, 1) forwards;
}

@keyframes llkBurst {
  0% { transform: translate(-50%, -50%) translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(0.25) rotate(var(--rot)); opacity: 0; }
}

.llk-cell.hint {
  animation: hintPulse 0.8s ease infinite;
}

@keyframes hintPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(92, 184, 255, 0.8); }
  50% { box-shadow: 0 0 0 6px rgba(92, 184, 255, 0.15); }
}

.llk-svg {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 5;
}

/* ===== 2048 ===== */
.game-root[data-game="game2048"] .panel { max-width: 560px; }

/* 目标标题 + 进度条 */
.g2048-goal {
  width: 100%;
  max-width: 560px;
  text-align: center;
}

.goal-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--text-main);
  margin-bottom: 8px;
}

.goal-bar {
  height: 14px;
  background: #f0e6d8;
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
}

.goal-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #5cb8ff, #e56aa8, #ff9d5c);
  transition: width 0.4s ease;
}

.goal-max {
  margin-top: 6px;
  font-size: 13px;
  color: var(--text-soft);
}

.g2048-board {
  display: grid;
  gap: 6px;                 /* 格子占满盘子 */
  background: #dcc9ac;
  border-radius: 16px;
  padding: 10px;
  box-shadow: var(--shadow);
  user-select: none;
}

.g2048-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: 800;
  border-radius: 8px;
  aspect-ratio: 1 / 1;      /* 正方形格子 */
  color: #6b5b45;
  box-shadow: 0 4px 0 rgba(90, 70, 40, 0.28), inset 0 2px 3px rgba(255, 255, 255, 0.75);  /* 体积感 */
  transition: transform 0.1s ease;
}

.g2048-cell.new {
  animation: g2048Drop 0.32s cubic-bezier(.3, .75, .4, 1.15);   /* 重力掉落 + 轻微弹跳 */
}

@keyframes g2048Drop {
  from { transform: translateY(-72px); opacity: 0; }
  60% { opacity: 1; }
  to { transform: translateY(0); opacity: 1; }
}

.g2048-cell.merged { animation: g2048Merge 0.22s ease; }

@keyframes g2048Merge {
  0% { transform: scale(1); }
  50% { transform: scale(1.25); }
  100% { transform: scale(1); }
}

/* ===== 扫雷 ===== */
.game-root[data-game="minesweeper"] .panel { max-width: 640px; }

.ms-board {
  display: grid;
  max-width: 640px;
  background: #c8d0d8;
  border-radius: 10px;
  padding: 6px;
  box-shadow: var(--shadow);
  user-select: none;
  border: 3px solid #aeb8c2;
}

.ms-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  min-height: 26px;
  aspect-ratio: 1 / 1;   /* 格子固定正方形，杜绝高度塌陷 */
  padding: 2px;
  border: none;
  cursor: pointer;
  background: #dde4ea;
  box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #9aa6b2;
  font-family: inherit;
}

.ms-cell.revealed {
  background: #e8edf2;
  box-shadow: inset 1px 1px 0 #c2cbd4;
  cursor: default;
}

.ms-cell.revealed.mine { background: #ff6b6b; }
.ms-cell .ms-num-1 { color: #1a6fd6; }
.ms-cell .ms-num-2 { color: #2e9e44; }
.ms-cell .ms-num-3 { color: #e04f3a; }
.ms-cell .ms-num-4 { color: #7b3fd4; }
.ms-cell .ms-num-5 { color: #c23a6b; }
.ms-cell .ms-num-6 { color: #2ea8a8; }
.ms-cell .ms-num-7 { color: #5b6b8c; }
.ms-cell .ms-num-8 { color: #8c8c8c; }

/* ===== 响应式（电脑端为主，手机适配） ===== */
@media (max-width: 720px) {
  .view { padding: 14px 10px 24px; }
  .menu-title { font-size: 32px; }
  .menu-subtitle { font-size: 13px; margin-bottom: 20px; }
  .menu-cards { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .game-card { padding: 16px 10px; }
  .card-icon { font-size: 38px; }
  .card-name { font-size: 17px; }
  .card-desc { font-size: 11px; }
  .menu-stats { font-size: 11px; gap: 6px 10px; }

  .game-header { flex-wrap: wrap; justify-content: center; gap: 6px; }
  .game-title { font-size: 19px; }
  .panel { font-size: 13px; padding: 8px 12px; gap: 8px 12px; }
  .btn { font-size: 13px; padding: 7px 14px; }

  /* 棋盘按屏宽自适应 */
  .llk-board, .sd-board, .g2048-board, .ms-board { max-width: 96vw; }
  .llk-cell { font-size: 15px; }
  .llk-cell.empty { font-size: 15px; }
  .fx-text { font-size: 22px; }
  .fx-wonderful, .fx-amazing { font-size: 28px; }
  .fx-unbelievable { font-size: 30px; }

  .sd-board[data-size="9"] .sd-cell { font-size: 17px; }
  .sd-board[data-size="12"] .sd-cell { font-size: 12px; }
  .sd-board[data-size="16"] .sd-cell { font-size: 9px; }
  .sd-note { font-size: 9px; }

/* =========================================================
 * app.js — 公共模块：视图切换、音效、存储、弹窗、游戏注册
 * ========================================================= */
(function () {
  'use strict';

  /* ---------- 存储助手（localStorage 安全封装） ---------- */
  const Store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) { /* 忽略配额/隐私模式错误 */ }
    }
  };

  /* ---------- 音效（Web Audio 合成，无外部文件） ---------- */
  const Sfx = {
    ctx: null,
    muted: false,
    ensure() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },
    tone(freq, dur, type, vol, when, slideTo) {
      const ctx = this.ensure();
      if (!ctx || this.muted) return;
      const t0 = ctx.currentTime + (when || 0);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      gain.gain.setValueAtTime(vol || 0.12, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    },
    click() { this.tone(660, 0.06, 'sine', 0.08); },
    select() { this.tone(880, 0.08, 'triangle', 0.1); },
    pop() { this.tone(520, 0.07, 'triangle', 0.1, 0, 780); },
    match() { this.tone(700, 0.1, 'triangle', 0.12); this.tone(1050, 0.12, 'sine', 0.08, 0.04); },
    merge() { this.tone(440, 0.09, 'square', 0.06, 0, 660); },
    reveal() { this.tone(300, 0.05, 'sine', 0.06); },
    flag() { this.tone(500, 0.07, 'triangle', 0.08); },
    boom() { this.tone(180, 0.5, 'sawtooth', 0.18, 0, 60); },
    wrong() { this.tone(240, 0.14, 'square', 0.06, 0, 160); },
    win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.12, i * 0.12)); },
    lose() { [400, 320, 250, 180].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.12, i * 0.13)); },
    task() { [784, 988].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.1, i * 0.08)); }
  };

  /* ---------- 通用弹窗 ---------- */
  let modalResolve = null;
  let modalCancelable = false;

  function showModal(opts) {
    const overlay = document.getElementById('modal');
    document.getElementById('modal-icon').textContent = opts.icon || '🎮';
    document.getElementById('modal-title').textContent = opts.title || '';
    document.getElementById('modal-message').textContent = opts.message || '';
    const actions = document.getElementById('modal-actions');
    actions.innerHTML = '';
    const buttons = opts.buttons || [{ label: '确定', value: 'ok', primary: true }];
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn' + (b.primary ? '' : ' ghost');
      btn.textContent = b.label;
      btn.addEventListener('click', () => {
        overlay.style.display = 'none';
        if (modalResolve) { const r = modalResolve; modalResolve = null; r(b.value); }
      });
      actions.appendChild(btn);
    });
    // 结果类弹窗默认不可取消（必须点按钮），防止 Esc 关闭后游戏锁死
    modalCancelable = opts.cancelable === true;
    overlay.style.display = 'flex';
    return new Promise(resolve => { modalResolve = resolve; });
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
    if (modalResolve) { const r = modalResolve; modalResolve = null; r(null); }
  }

  /* ---------- 视图切换 ---------- */
  const games = {}; // name -> { title, mount, unmount }

  function registerGame(name, def) {
    games[name] = def;
  }

  let currentGame = null;

  function showMenu() {
    if (currentGame && games[currentGame].unmount) games[currentGame].unmount();
    currentGame = null;
    document.getElementById('view-game').style.display = 'none';
    // 必须用 flex（与 CSS 一致），否则覆盖掉居中对齐
    document.getElementById('view-menu').style.display = 'flex';
    refreshMenuStats();
  }

  function showGame(name) {
    const def = games[name];
    if (!def) return;
    if (currentGame && games[currentGame].unmount) games[currentGame].unmount();
    currentGame = name;
    document.getElementById('view-menu').style.display = 'none';
    document.getElementById('view-game').style.display = 'block';
    document.getElementById('game-title').textContent = def.title;
    // 通过 data 属性区分当前游戏，绝不修改容器的 id（否则再次进入会找不到容器）
    const root = document.getElementById('game-root');
    root.innerHTML = '';
    root.dataset.game = name;
    if (def.mount) def.mount(root);
  }

  function refreshMenuStats() {
    const set = (id, text) => {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    };
    // 数独各档最快纪录（展示 9×9 专家）
    const sd = Store.get('mini.sudoku.best', {});
    set('stat-sudoku', '数独 · 9×9 专家 ' + (sd.expert9 ? sd.expert9 + 's' : '—'));
    // 连连看最佳时间
    const llk = Store.get('mini.llk.best', null);
    set('stat-lianliankan', llk ? '连连看 · 最佳 ' + llk + 's' : '连连看 · 最佳 —');
    // 2048 最高分
    const g2 = Store.get('mini.2048.best', 0);
    set('stat-game2048', '2048 · 最高 ' + g2);
    // 扫雷各难度纪录（展示初级）
    const ms = Store.get('mini.ms.best', {});
    set('stat-minesweeper', '扫雷 · 初级 ' + (ms.easy ? ms.easy + 's' : '—'));
  }

  /* ---------- 初始化 ---------- */
  // 全局错误提示：移动端排查用，出错时在页面顶部显示红条
  function showErrorBar(msg) {
    if (document.getElementById('mini-error-bar')) return;
    const bar = document.createElement('div');
    bar.id = 'mini-error-bar';
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#e04f3a;color:#fff;' +
      'padding:10px 14px;font-size:13px;line-height:1.5;z-index:99999;white-space:pre-wrap;';
    bar.textContent = '⚠️ ' + msg;
    document.body.appendChild(bar);
  }
  window.addEventListener('error', (e) => {
    showErrorBar('脚本错误：' + (e.message || e.type) + (e.lineno ? '（第 ' + e.lineno + ' 行）' : ''));
  }, true);
  window.addEventListener('unhandledrejection', (e) => {
    const r = e.reason;
    showErrorBar('未处理错误：' + ((r && r.message) || r));
  });

  function init() {
    document.getElementById('btn-back').addEventListener('click', () => { Sfx.click(); showMenu(); });
    document.querySelectorAll('.game-card').forEach(card => {
      card.addEventListener('click', () => {
        Sfx.select();
        showGame(card.dataset.game);
      });
    });
    // 点击弹窗遮罩空白处关闭（仅可取消的弹窗）
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal' && modalCancelable) closeModal();
    });
    // 键盘 Esc 关闭弹窗（仅可取消的弹窗）
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalCancelable) closeModal();
    });
    refreshMenuStats();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* 暴露公共 API */
  window.Mini = { Store, Sfx, showModal, registerGame, showMenu, showGame };
})();

  <script>
/* =========================================================
 * sudoku.js — 数独（9×9 专家/大师 · 12×12 大师 · 16×16 极限）
 * 结构：纯逻辑（可 node 测试）+ UI 层（浏览器）
 * ========================================================= */
(function (global, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    global.SudokuGame = factory();
  }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const isNode = typeof document === 'undefined';

  /* ==================== 配置 ==================== */
  const DIFFS = {
    expert9:   { label: '9×9 专家', size: 9,  clues: 30 },
    master9:   { label: '9×9 大师', size: 9,  clues: 24 },
    master12:  { label: '12×12 大师', size: 12, clues: 48 },
    extreme16: { label: '16×16 极限', size: 16, clues: 88 }
  };
  const DIFF_ORDER = ['expert9', 'master9', 'master12', 'extreme16'];

  /* ==================== 纯逻辑 ==================== */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 宫的尺寸 [行数, 列数]
  function boxDims(size) {
    if (size === 9) return [3, 3];
    if (size === 12) return [3, 4];
    if (size === 16) return [4, 4];
    const s = Math.round(Math.sqrt(size));
    return [s, size / s];
  }

  // (r,c) 处的候选数字
  function candidates(board, r, c) {
    const size = board.length;
    const [bh, bw] = boxDims(size);
    const used = new Set();
    for (let i = 0; i < size; i++) {
      if (board[r][i]) used.add(board[r][i]);
      if (board[i][c]) used.add(board[i][c]);
    }
    const br = Math.floor(r / bh) * bh, bc = Math.floor(c / bw) * bw;
    for (let i = br; i < br + bh; i++)
      for (let j = bc; j < bc + bw; j++)
        if (board[i][j]) used.add(board[i][j]);
    const list = [];
    for (let v = 1; v <= size; v++) if (!used.has(v)) list.push(v);
    return list;
  }

  // 生成一个随机完整终局
  function randomFill(size) {
    const board = Array.from({ length: size }, () => Array(size).fill(0));
    (function fill() {
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] !== 0) continue;
          const cands = shuffle(candidates(board, r, c));
          for (const v of cands) {
            board[r][c] = v;
            if (fill()) return true;
            board[r][c] = 0;
          }
          return false;
        }
      }
      return true;
    })();
    return board;
  }

  // 位掩码求解器（内部状态：行/列/宫掩码，候选计算 O(1)）
  // MRV 回溯数解，最多数到 maxCount；maxNodes 为节点预算（超预算返回 -1）
  function solveCount(board, maxCount, maxNodes) {
    const size = board.length;
    const [bh, bw] = boxDims(size);
    const full = (1 << size) - 1;
    const rowM = new Array(size).fill(0), colM = new Array(size).fill(0), boxM = new Array(size).fill(0);
    const boxOf = (r, c) => Math.floor(r / bh) * bw + Math.floor(c / bw);
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++) {
        const v = board[r][c];
        if (!v) continue;
        const bit = 1 << (v - 1);
        rowM[r] |= bit; colM[c] |= bit; boxM[boxOf(r, c)] |= bit;
      }
    const limit = maxNodes || Infinity;
    let count = 0, nodes = 0, aborted = false;
    (function solve() {
      if (aborted) return;
      if (++nodes > limit) { aborted = true; return; }
      let best = null, bestFree = 0, bestCnt = Infinity;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] !== 0) continue;
          const free = full & ~(rowM[r] | colM[c] | boxM[boxOf(r, c)]);
          if (!free) return;                       // 无候选，死路
          const cnt = popcount(free);

        const bit = free & -free;
        const v = 31 - Math.clz32(bit) + 1;
        board[r][c] = v;
        rowM[r] |= bit; colM[c] |= bit; boxM[b] |= bit;
        solve();
        board[r][c] = 0;
        rowM[r] &= ~bit; colM[c] &= ~bit; boxM[b] &= ~bit;
        if (aborted || count >= maxCount) return;
      }

  }

  // 位掩码版：收集解列表（最多 maxCount 个完整解；maxNodes 为节点预算，超预算返回 null）
  function solveList(board, maxCount, maxNodes) {
    const size = board.length;
    const [bh, bw] = boxDims(size);
    const full = (1 << size) - 1;
    const rowM = new Array(size).fill(0), colM = new Array(size).fill(0), boxM = new Array(size).fill(0);
    const boxOf = (r, c) => Math.floor(r / bh) * bw + Math.floor(c / bw);
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++) {
        const v = board[r][c];
        if (!v) continue;
        const bit = 1 << (v - 1);
        rowM[r] |= bit; colM[c] |= bit; boxM[boxOf(r, c)] |= bit;
      }
    const limit = maxNodes || Infinity;
    const solutions = [];
    let nodes = 0, aborted = false;
    (function solve() {
      if (aborted || solutions.length >= maxCount) return;
      if (++nodes > limit) { aborted = true; return; }
      let best = null, bestFree = 0, bestCnt = Infinity;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] !== 0) continue;
          const free = full & ~(rowM[r] | colM[c] | boxM[boxOf(r, c)]);
          if (!free) return;
          const cnt = popcount(free);
          if (cnt < bestCnt) { best = [r, c]; bestFree = free; bestCnt = cnt; }
          if (cnt === 1) break;
        }
        if (bestCnt === 1) break;
      }
      if (!best) { solutions.push(board.map(row => row.slice())); return; }
      const [r, c] = best, b = boxOf(r, c);
      for (let free = bestFree; free; free &= free - 1) {
        const bit = free & -free;
        const v = 31 - Math.clz32(bit) + 1;
        board[r][c] = v;
        rowM[r] |= bit; colM[c] |= bit; boxM[b] |= bit;
        solve();
        board[r][c] = 0;
        rowM[r] &= ~bit; colM[c] &= ~bit; boxM[b] &= ~bit;
        if (aborted || solutions.length >= maxCount) return;

  function generatePuzzle(size, targetClues) {

    let clues = total;
